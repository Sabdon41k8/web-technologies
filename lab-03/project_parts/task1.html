<!DOCTYPE html>

    <title>Завдання 1 - Таблиця</title>

<body>

<center>
<table border="2" width="400" height="400">

    <tr>
        <td colspan="8" bgcolor="#ee7ea0"></td>
    </tr>

    <tr>
        <td rowspan="6" bgcolor="#ffffcc"></td>
        <td colspan="6" bgcolor="#ee7ea0"></td>
        <td rowspan="6" bgcolor="#ffffcc"></td>
    </tr>

    <tr>
        <td rowspan="4" bgcolor="#ffffcc"></td>
        <td colspan="4" bgcolor="#ee7ea0"></td>
        <td rowspan="4" bgcolor="#ffffcc"></td>
    </tr>

    <tr>
        <td rowspan="2" bgcolor="#ffffcc"></td>
        <td bgcolor="red"></td>
        <td bgcolor="blue"></td>
        <td rowspan="2" bgcolor="#ffffcc"></td>
    </tr>

    <tr>
        <td bgcolor="lime"></td>
        <td bgcolor="yellow"></td>
    </tr>

    <tr>
        <td colspan="4" bgcolor="#ee7ea0"></td>
    </tr>

    <tr>
        <td colspan="6" bgcolor="#ee7ea0"></td>
    </tr>

    <tr>
        <td colspan="8" bgcolor="#ee7ea0"></td>
    </tr>

</table>
</center>

</body>
</html>
