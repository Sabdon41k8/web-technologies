<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <title>Форма реєстрації та збору інформації</title>
</head>
<body>
    <header>
        <h1><a href="../index.html">Повернутися до головної сторінки</a></h1>
    </header>

  <h1>Форма збору інформації (HTML5)</h1>

  <form action="#" method="get" tabindex="-1">

    <fieldset>
      <legend>Особисті та контактні дані</legend>

      <p>
        <label for="username">Текстове поле (ПІБ):</label><br>
        <input type="text" id="username" name="username" placeholder="Іванов Іван Іванович" required tabindex="1">
      </p>

      <p>
        <label for="user_pass">Пароль (6 символів: min 1 мала, 1 велика, 1 цифра):</label><br>
        <input type="password" id="user_pass" name="user_pass" placeholder="Abc123" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z]).{6}" title="Пароль повинен містити рівно 6 символів, щонайменше одну велику літеру, одну малу літеру та одну цифру" required tabindex="2">
      </p>

      <p>
        <label for="user_email">Email (без автозаповнення):</label><br>
        <input type="email" id="user_email" name="user_email" placeholder="example@domain.com" autocomplete="off" pattern="[a-z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,}$" required tabindex="3">
      </p>

      <p>
        <label for="user_tel">Мобільний номер (формат +380XXXXXXXXX):</label><br>
        <input type="tel" id="user_tel" name="user_tel" placeholder="+380991234567" pattern="\+380\d{9}" required tabindex="4">
      </p>

      <p>
        <label for="birth_date">Дата народження:</label><br>
        <input type="date" id="birth_date" name="birth_date" value="2000-01-01" tabindex="5">
      </p>

      <p>
        <label for="city_choice">Місто (з підказками datalist):</label><br>
        <input type="text" id="city_choice" name="city_choice" list="cities_list" placeholder="Оберіть або введіть місто" tabindex="6">
        <datalist id="cities_list">
          <option value="Київ"></option>
          <option value="Харків"></option>
          <option value="Одеса"></option>
          <option value="Дніпро"></option>
          <option value="Львів"></option>
        </datalist>
      </p>
    </fieldset>

    <br>

    <fieldset>
      <legend>Опитування та уподобання</legend>

      <p><strong>Радіо-блок 1 (Рівень освіти):</strong><br>
        <label><input type="radio" name="education" value="basic" tabindex="7"> Середня</label><br>
        <label><input type="radio" name="education" value="bachelor" tabindex="8"> Бакалавр</label><br>
        <label><input type="radio" name="education" value="master" tabindex="9"> Магістр</label>
      </p>

      <p><strong>Радіо-блок 2 (Формат навчання — 2-ге значення за замовчуванням):</strong><br>
        <label><input type="radio" name="format" value="offline" tabindex="10"> Офлайн</label><br>
        <label><input type="radio" name="format" value="online" checked tabindex="11"> Онлайн (за замовчуванням)</label><br>
        <label><input type="radio" name="format" value="mixed" tabindex="12"> Змішаний</label>
      </p>

      <p><strong>Чекбокси (Інтереси — 4 значення):</strong><br>
        <label><input type="checkbox" name="interests" value="web" tabindex="13"> Web-розробка</label><br>
        <label><input type="checkbox" name="interests" value="design" tabindex="14"> Дизайн</label><br>
        <label><input type="checkbox" name="interests" value="qa" tabindex="15"> Тестування (QA)</label><br>
        <label><input type="checkbox" name="interests" value="devops" tabindex="16"> DevOps</label>
      </p>

      <p>
        <label for="experience">Досвід у сфері (3-тє значення за замовчуванням):</label><br>
        <select id="experience" name="experience" tabindex="17">
          <option value="none">Без досвіду</option>
          <option value="less_1">Менше 1 року</option>
          <option value="1_to_3" selected>Від 1 до 3 років (за замовчуванням)</option>
          <option value="3_to_5">Від 3 до 5 років</option>
          <option value="more_5">Понад 5 років</option>
        </select>
      </p>

      <p>
        <label for="languages">Мови програмування (множинний вибір - затисніть Ctrl/Cmd):</label><br>
        <select id="languages" name="languages" multiple size="4" tabindex="18">
          <option value="js">JavaScript</option>
          <option value="html_css">HTML/CSS</option>
          <option value="python">Python</option>
          <option value="php">PHP</option>
          <option value="java">Java</option>
          <option value="cpp">C++</option>
        </select>
      </p>

      <p>
        <label for="specialization">Спеціалізація (з групуванням optgroup):</label><br>
        <select id="specialization" name="specialization" tabindex="19">
          <optgroup label="Frontend">
            <option value="react">React</option>
            <option value="vue">Vue.js</option>
            <option value="angular">Angular</option>
          </optgroup>
          <optgroup label="Backend">
            <option value="node">Node.js</option>
            <option value="laravel">Laravel</option>
            <option value="django">Django</option>
          </optgroup>
          <optgroup label="Mobile">
            <option value="flutter">Flutter</option>
            <option value="react_native">React Native</option>
            <option value="swift">Swift</option>
          </optgroup>
          <optgroup label="Data Science">
            <option value="pandas">Pandas/NumPy</option>
            <option value="ml">Machine Learning</option>
            <option value="bi">Power BI</option>
          </optgroup>
        </select>
      </p>
    </fieldset>

    <br>

    <fieldset>
      <legend>Файли та додаткова інформація</legend>

      <p>
        <label for="audio_files">Завантаження аудіофайлів (декілька файлів, тільки аудіо):</label><br>
        <input type="file" id="audio_files" name="audio_files" accept="audio/*" multiple tabindex="20">
      </p>

      <p>
        <label for="bio">Додаткова інформація про себе (textarea):</label><br>
        <textarea id="bio" name="bio" rows="4" cols="50" placeholder="Розкажіть дещо про свій досвід..." tabindex="21"></textarea>
      </p>
    </fieldset>

    <br>

    <p>
      <input type="submit" value="Надіслати форму" tabindex="22">
      <input type="reset" value="Очистити форму" tabindex="23">
    </p>

  </form>

</body>
</html>
