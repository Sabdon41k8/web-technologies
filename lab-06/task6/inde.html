<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Task 6</title>
</head>
<body class="page">
    <header class="top-bar">
    <a class="top-link" href="#" tabindex="0">Mail</a>
    <a class="top-link" href="#" tabindex="0">Images</a>
 
    <div class="popup-wrapper"> <!-- Прихований (але фокусований) чекбокс поверх іконки: керує станом попапа без JS -->
      <input class="popup-button" type="checkbox" tabindex="0" aria-label="Apps">
      <span class="popup-button-icon">
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
        <span class="dot"></span><span class="dot"></span><span class="dot"></span>
      </span>
 
      <div class="popup">
        <div class="popup-scroll" tabindex="0">
          <div class="app-grid">
            <a class="app-item" href="#" tabindex="0"><span class="app-icon icon-calendar">📅</span><span class="app-name">Calendar</span></a>
            <a class="app-item" href="#" tabindex="0"><span class="app-icon icon-mail">✉️</span><span class="app-name">Mail</span></a>
            <a class="app-item" href="#" tabindex="0"><span class="app-icon icon-news">📰</span><span class="app-name">News</span></a>
            <a class="app-item" href="#" tabindex="0"><span class="app-icon icon-map">📍</span><span class="app-name">Map</span></a>
            <a class="app-item" href="#" tabindex="0"><span class="app-icon icon-files">📁</span><span class="app-name">Files</span></a>
            <a class="app-item" href="#" tabindex="0"><span class="app-icon icon-contacts">👤</span><span class="app-name">Contacts</span></a>
            <a class="app-item" href="#" tabindex="0"><span class="app-icon icon-translate">🌐</span><span class="app-name">Translate</span></a>
            <a class="app-item" href="#" tabindex="0"><span class="app-icon icon-videos">▶️</span><span class="app-name">Videos</span></a>
            <a class="app-item" href="#" tabindex="0"><span class="app-icon icon-search">🔍</span><span class="app-name">Search</span></a>
            <a class="app-item" href="#" tabindex="0"><span class="app-icon icon-photo">🖼️</span><span class="app-name">Photo</span></a>
            <a class="app-item" href="#" tabindex="0"><span class="app-icon icon-apps">🎨</span><span class="app-name">Apps</span></a>
            <a class="app-item" href="#" tabindex="0"><span class="app-icon icon-document">📄</span><span class="app-name">Document</span></a>
          </div>

          <div class="more-extra">
            <div class="app-grid">
              <a class="app-item" href="#" tabindex="0"><span class="app-icon icon-chat">💬</span><span class="app-name">Chat</span></a>
              <a class="app-item" href="#" tabindex="0"><span class="app-icon icon-classroom">🏫</span><span class="app-name">Classroom</span></a>
              <a class="app-item" href="#" tabindex="0"><span class="app-icon icon-collection">✳️</span><span class="app-name">Collection</span></a>
              <a class="app-item" href="#" tabindex="0"><span class="app-icon icon-mars">🔴</span><span class="app-name">Mars</span></a>
              <a class="app-item" href="#" tabindex="0"><span class="app-icon icon-blogs">🧱</span><span class="app-name">Blogs</span></a>
              <a class="app-item" href="#" tabindex="0"><span class="app-icon icon-promos">📢</span><span class="app-name">Promos</span></a>
            </div>
            <a class="even-more" href="#" tabindex="0">Even more from Kottans</a>
          </div>
        </div>
 
        <div class="more-wrapper">
          <input class="more-button" type="checkbox" tabindex="0" aria-label="More">
          <span class="more-label">
            <span class="more-text-more">More</span>
            <span class="more-text-less">Less</span>
          </span>
        </div>
      </div>
    </div>
 
    <a class="top-link top-bell" href="#" tabindex="0" aria-label="Notifications">🔔</a>
    <a class="top-avatar" href="#" tabindex="0" aria-label="Profile">🧑</a>
  </header>


</body>
